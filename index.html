<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Si-Gestión</title>
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FAF7F0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Si-Gestión">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Conexión inicial del dispositivo -->
  <div id="setup" class="setup hidden">
    <div class="setup-box">
      <img src="icons/icon-192.png" alt="" class="setup-logo">
      <h1>Si-Gestión</h1>
      <p class="sub" id="setup-sub">Conectá este dispositivo con tu servidor.</p>
      <form id="setup-form" class="form"></form>
    </div>
  </div>

  <!-- Aplicación -->
  <div id="app" class="app hidden">
    <aside class="side">
      <div class="brand" data-act="elegirPerfil" title="Cambiar de versión"><img src="icons/icon-192.png" alt=""><div><b>Si-Gestión</b><small id="empresa">Si-Gestión</small></div></div>
      <nav id="nav-side"></nav>
    </aside>
    <div class="content">
      <header class="top">
        <h1 id="titulo"></h1>
        <div id="acciones" class="acciones"></div>
      </header>
      <div id="banda-demo" class="banda-demo hidden">Versión de demostración · datos inventados</div>
      <main id="main"></main>
    </div>
    <nav id="nav-bottom" class="bottom"></nav>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
  <div id="toast" class="toast hidden"></div>
  <div id="cargando" class="cargando hidden"><div class="spin"></div></div>

  <script src="app.js"></script>
</body>
</html>
